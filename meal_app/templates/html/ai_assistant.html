{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    {% include 'common/common_css.html' %}
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8fafc;
        }

        .navbar {
            background-color: #7235dc;
        }
        .chat-box {
            min-height: 260px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid #2f4878;
            background: #e8ebed;
            border-radius: 16px;
            margin: 1%;
            padding: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
        }

        .user-message {
            margin-left: auto;
            background: #a67c38;
            color: white;
        }

        .ai-message {
            background: #f3f4f6;
            color: #111827;
        }
    </style>
</head>

<body>
    {% include 'common/header.html' %}
    <div class="main-div">
    <div style="margin: 5%; margin-left: 6%;" class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0 rounded-4 p-4">
                    <h2 class="fw-bold text-center mb-4" style="color: #a67c38;"> AI Assistant</h2>
                    <div id="chat-box" class="chat-box" aria-live="polite"></div>

                    <form id="chat-form" class="mt-4">
                        {% csrf_token %}
                        <div class="input-group">
                            <input id="message" type="text" class="form-control"
                                placeholder="Ask about the app and writing support..." required>
                            <button class="btn btn-warning1 text-white" type="submit">Send</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script>
        const chatForm = document.getElementById('chat-form');
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message');

        function addMessage(sender, text) {
            const div = document.createElement('div');
            div.className = 'message ' + (sender === 'user' ? 'user-message' : 'ai-message');
            div.innerHTML = '<strong>' + (sender === 'user' ? 'You' : 'AI') + ':</strong> ' + text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const question = messageInput.value.trim();
            if (!question) return;

            addMessage('user', question);
            messageInput.value = '';

            const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;
            const formData = new FormData();
            formData.append('message', question);

            try {
                const response = await fetch('/api/ai-chat/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrf,
                    },
                    body: formData
                });

                const data = await response.json();
                addMessage('ai', data.reply || 'No response from AI.');
            } catch (error) {
                addMessage('ai', 'Something went wrong while contacting the AI service.');
            }
        });
    </script>
    <!-- footer code included here  -->
    {% include 'common/footer.html' %}
</body>

</html>
